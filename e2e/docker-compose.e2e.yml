services:
  postgres:
    image: postgres:17
    mem_limit: 256m
    environment:
      POSTGRES_DB: blukios_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blukios_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:8
    mem_limit: 384m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    mem_limit: 96m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: blukios-e2e-api
    mem_limit: 512m
    build:
      context: ./api-blue
    entrypoint: ["sh", "/e2e/start-api.sh"]
    environment:
      APP_ENV: e2e
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://web
      FRONTEND_URL: ""
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: blukios_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: test
      DB_MONGO_HOST: mongo
      DB_MONGO_DATABASE: blukios_e2e
      REDIS_HOST: redis
      REDIS_PREFIX: "blukios-e2e:"
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      GOOGLE_REDIRECT_URL: /api/auth/google/callback
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./e2e/start-api.sh:/e2e/start-api.sh:ro
      - ./e2e/product.svg:/e2e/product.svg:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  web:
    image: blukios-e2e-web
    mem_limit: 96m
    networks: [default, edge]
    build:
      context: ./fe-blue
      dockerfile: ../e2e/frontend.Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/product.svg:/usr/share/nginx/html/e2e-product.svg:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30

  playwright:
    image: blukios-e2e-playwright
    mem_limit: 1g
    build:
      context: ./e2e
      dockerfile: playwright.Dockerfile
    profiles: ["test"]
    init: true
    shm_size: 1gb
    environment:
      BASE_URL: http://web
      CI: "true"
    volumes:
      - ./e2e/artifacts:/work/artifacts

  seller:
    image: blukios-e2e-seller
    mem_limit: 96m
    networks: [default, edge]
    build:
      context: ./fe-blue
      dockerfile: ../e2e/frontend.Dockerfile
      args:
        APP_TARGET: seller
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/product.svg:/usr/share/nginx/html/e2e-product.svg:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  default:
    internal: true
  edge: {}

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  redis-data:
