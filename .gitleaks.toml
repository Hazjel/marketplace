title = "Blukios gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Midtrans client key -- didesain publik oleh Midtrans (dibundle ke JS frontend apa pun caranya, beda dari server key). Server key TIDAK ada di sini -- itu selalu lewat env var/.env yang gitignored."
regexTarget = "match"
regexes = [
  '''Mid-client-[A-Za-z0-9]+''',
]

# Blok terpisah: di dalam satu blok, paths dan regexes digabung OR, jadi path
# ini tidak boleh ikut melonggarkan aturan Midtrans di atas.
[[allowlists]]
description = "Dependensi pihak ketiga yang dipasang CI di workspace (gitignored, bukan kode kita). dist/ sengaja tetap dipindai: secret yang bocor lewat VITE_* muncul di sana."
paths = [
  '''(^|/)(vendor|node_modules|venv|\.venv|__pycache__)/''',
]
