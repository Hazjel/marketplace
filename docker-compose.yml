services:
  # ─────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────

  mongo-express:
    image: mongo-express:latest
    container_name: blue-mongo-express
    restart: unless-stopped
    # shared-mongo hidup di luar compose project ini, jadi tidak bisa
    # di-depends_on; mongo-express sendiri sudah retry koneksi saat start.
    # Tanpa login dan memegang kredensial shared-mongo: hanya loopback, akses lewat SSH tunnel.
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - default
      - shared-infra
    environment:
      ME_CONFIG_MONGODB_SERVER: ${DB_MONGO_HOST:-shared-mongo}
      ME_CONFIG_MONGODB_PORT: ${DB_MONGO_PORT:-27017}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_MONGO_USERNAME:?DB_MONGO_USERNAME wajib diisi di .env -- shared Mongo memakai auth}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_MONGO_PASSWORD:?DB_MONGO_PASSWORD wajib diisi di .env -- shared Mongo memakai auth}
      ME_CONFIG_BASICAUTH: "false"

  # ─────────────────────────────────────────
  # Backend API (Laravel + Nginx)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./api-blue
    container_name: blue-api
    restart: unless-stopped
    entrypoint: ["bash", "/var/www/docker-entrypoint.sh"]
    expose:
      - "9000"
    # Ketiga datastore (Postgres, Mongo, Redis) sekarang tinggal di
    # /opt/shared-infra, di luar compose project ini -- Compose tidak bisa
    # `depends_on` service yang bukan miliknya, jadi startup aplikasi harus
    # tahan kalau salah satunya sesaat belum siap, lewat jalur reconnect
    # klien biasa, bukan lewat gate startup.
    networks:
      - default
      - shared-infra
    volumes:
      - ./api-blue:/var/www
      - api_vendor:/var/www/vendor
    environment:
      APP_NAME: Blukios
      # Default aman: production/matikan debug kalau tidak di-override.
      # Sebelumnya production sungguhan berjalan dengan APP_ENV=local dan
      # APP_DEBUG=true karena nilainya hardcode di sini -- setiap exception
      # tak tertangani (bukan cuma yang eksplisit di-catch) mengembalikan
      # halaman debug Laravel lengkap dengan stack trace ke client yang
      # tidak terautentikasi. bootstrap/app.php sudah punya fallback yang
      # menyembunyikannya (! app()->hasDebugModeEnabled()), tapi itu
      # dilumpuhkan selama APP_DEBUG bernilai true di sini.
      #
      # Dev lokal yang butuh Whoops/Ignition set APP_DEBUG=true dan
      # APP_ENV=local di .env sendiri -- itu meng-override default ini.
      APP_ENV: ${APP_ENV:-production}
      # Cache config/route container ke luar bind mount — kalau tidak, cache
      # berisi DB_HOST=shared-postgres bocor ke host dan merusak `php artisan test` lokal
      APP_CONFIG_CACHE: /tmp/laravel-config.php
      APP_ROUTES_CACHE: /tmp/laravel-routes.php
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      # Shared Postgres -- pola yang sama dengan shared Redis di C2.1B:
      # instance-nya hidup di /opt/shared-infra, punya auth, dan tidak
      # menyediakan user anonim. Karena itu kredensialnya tidak diberi
      # default sama sekali; compose menolak start kalau .env belum diisi.
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-shared-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-blukios}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env -- shared Postgres tidak punya user anonim}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env -- shared Postgres tidak punya user anonim}
      DB_MONGO_CONNECTION: mongodb
      DB_MONGO_HOST: ${DB_MONGO_HOST:-shared-mongo}
      DB_MONGO_PORT: ${DB_MONGO_PORT:-27017}
      DB_MONGO_DATABASE: ${DB_MONGO_DATABASE:-blukios_mongo}
      DB_MONGO_USERNAME: ${DB_MONGO_USERNAME:?DB_MONGO_USERNAME wajib diisi di .env -- shared Mongo memakai auth}
      DB_MONGO_PASSWORD: ${DB_MONGO_PASSWORD:?DB_MONGO_PASSWORD wajib diisi di .env -- shared Mongo memakai auth}
      DB_MONGO_AUTHENTICATION_DATABASE: ${DB_MONGO_AUTHENTICATION_DATABASE:-admin}
      # Shared Redis (Sprint C2.1B) -- see docs/c2-1b-shared-redis-cutover.md.
      # USERNAME/PASSWORD are required (no default): the shared instance is
      # authenticated, unlike the retired local blue-redis.
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      # Key-namespace boundary, bukan Redis logical DB -- shared instance
      # sudah punya workload lain (mis. prefix `asynq:`) di db yang sama.
      REDIS_PREFIX: ${REDIS_PREFIX:-blukios:}
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@blukios.com}
      MAIL_FROM_NAME: Blukios
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: "false"
      KEY_RAJA_ONGKIR: ${KEY_RAJA_ONGKIR:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Dua domain FE (buyer + seller) -- lihat config/cors.php, fallback
      # ke FRONTEND_URL tunggal kalau var ini belum di-set di .env.
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "543210123"
      REVERB_APP_KEY: ${REVERB_APP_KEY:-reverbkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-reverbsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      # Fallback ke KEY_RAJA_ONGKIR — string kosong akan menimpa fallback di config
      KOMERCE_API_KEY: ${KOMERCE_API_KEY:-${KEY_RAJA_ONGKIR:-}}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY wajib diisi di .env}
      CHAT_SERVICE_URL: http://chat-service:8001

  nginx:
    image: nginx:alpine
    container_name: blue-nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
      - frontend-seller
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./api-blue:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - fe_dist:/usr/share/nginx/html:ro
      - fe_dist_seller:/usr/share/nginx/html-seller:ro

  # ─────────────────────────────────────────
  # Queue Worker
  # ─────────────────────────────────────────
  queue:
    build:
      context: ./api-blue
    container_name: blue-queue
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    depends_on:
      - api
    networks:
      - default
      - shared-infra
    volumes:
      - ./api-blue:/var/www
      - api_vendor:/var/www/vendor
    environment:
      APP_NAME: Blukios
      APP_ENV: ${APP_ENV:-production}
      # Cache config/route container ke luar bind mount — kalau tidak, cache
      # berisi DB_HOST=shared-postgres bocor ke host dan merusak `php artisan test` lokal
      APP_CONFIG_CACHE: /tmp/laravel-config.php
      APP_ROUTES_CACHE: /tmp/laravel-routes.php
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      # Shared Postgres -- pola yang sama dengan shared Redis di C2.1B:
      # instance-nya hidup di /opt/shared-infra, punya auth, dan tidak
      # menyediakan user anonim. Karena itu kredensialnya tidak diberi
      # default sama sekali; compose menolak start kalau .env belum diisi.
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-shared-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-blukios}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env -- shared Postgres tidak punya user anonim}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env -- shared Postgres tidak punya user anonim}
      # Shared Redis (Sprint C2.1B) -- see docs/c2-1b-shared-redis-cutover.md.
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PREFIX: ${REDIS_PREFIX:-blukios:}
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "543210123"
      REVERB_APP_KEY: ${REVERB_APP_KEY:-reverbkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-reverbsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY wajib diisi di .env}
      CHAT_SERVICE_URL: http://chat-service:8001

  # ─────────────────────────────────────────
  # Scheduler — jalankan Schedule::command() di routes/console.php
  # (transaction:check-expiry tiap menit, transaction:auto-complete harian).
  # Tanpa ini schedule:run tidak pernah terpanggil sama sekali.
  # ─────────────────────────────────────────
  scheduler:
    build:
      context: ./api-blue
    container_name: blue-scheduler
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      - api
    networks:
      - default
      - shared-infra
    volumes:
      - ./api-blue:/var/www
      - api_vendor:/var/www/vendor
    environment:
      APP_NAME: Blukios
      APP_ENV: ${APP_ENV:-production}
      # Cache config/route container ke luar bind mount — kalau tidak, cache
      # berisi DB_HOST=shared-postgres bocor ke host dan merusak `php artisan test` lokal
      APP_CONFIG_CACHE: /tmp/laravel-config.php
      APP_ROUTES_CACHE: /tmp/laravel-routes.php
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      # Shared Postgres -- pola yang sama dengan shared Redis di C2.1B:
      # instance-nya hidup di /opt/shared-infra, punya auth, dan tidak
      # menyediakan user anonim. Karena itu kredensialnya tidak diberi
      # default sama sekali; compose menolak start kalau .env belum diisi.
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-shared-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-blukios}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env -- shared Postgres tidak punya user anonim}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env -- shared Postgres tidak punya user anonim}
      # Shared Redis (Sprint C2.1B) -- see docs/c2-1b-shared-redis-cutover.md.
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PREFIX: ${REDIS_PREFIX:-blukios:}
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: "false"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY wajib diisi di .env}
      CHAT_SERVICE_URL: http://chat-service:8001

  # ─────────────────────────────────────────
  # Reverb WebSocket Server
  # ─────────────────────────────────────────
  reverb:
    build:
      context: ./api-blue
    container_name: blue-reverb
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      - api
    networks:
      - default
      - shared-infra
    volumes:
      - ./api-blue:/var/www
      - api_vendor:/var/www/vendor
    environment:
      APP_NAME: Blukios
      APP_ENV: ${APP_ENV:-production}
      # Cache config/route container ke luar bind mount — kalau tidak, cache
      # berisi DB_HOST=shared-postgres bocor ke host dan merusak `php artisan test` lokal
      APP_CONFIG_CACHE: /tmp/laravel-config.php
      APP_ROUTES_CACHE: /tmp/laravel-routes.php
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      REVERB_APP_ID: "543210123"
      REVERB_APP_KEY: ${REVERB_APP_KEY:-reverbkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-reverbsecret}
      # Shared Redis (Sprint C2.1B) -- see docs/c2-1b-shared-redis-cutover.md.
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PREFIX: ${REDIS_PREFIX:-blukios:}
      REDIS_CLIENT: predis
      CACHE_STORE: redis

  # ─────────────────────────────────────────
  # Frontend — Buyer app (blukios.store)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./fe-blue
      args:
        VITE_APP_NAME: Blue
        # Relative — nginx proxy /api & /ai, jalan di localhost/LAN/Tailscale sekaligus
        VITE_API_BASE_URL: /api
        VITE_AI_SERVICE_URL: /ai
        VITE_RECOMMENDATION_BASE_URL: /recommend
        VITE_MIDTRANS_CLIENT_KEY: Mid-client-xjQUjCcbhOHl68O3
        VITE_MIDTRANS_IS_PRODUCTION: "false"
        # Host/port websocket dinamis mengikuti halaman (lihat echo.js)
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-reverbkey}
        VITE_APP_TARGET: buyer
        VITE_BUYER_APP_URL: ${BUYER_APP_URL:-https://blukios.store}
        VITE_SELLER_APP_URL: ${SELLER_APP_URL:-https://seller.blukios.store}
    container_name: blue-frontend
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - fe_dist:/app/dist

  # ─────────────────────────────────────────
  # Frontend — Seller app (seller.blukios.store)
  # ─────────────────────────────────────────
  frontend-seller:
    build:
      context: ./fe-blue
      args:
        VITE_APP_NAME: Blue Seller
        VITE_API_BASE_URL: /api
        VITE_AI_SERVICE_URL: /ai
        VITE_RECOMMENDATION_BASE_URL: /recommend
        VITE_MIDTRANS_CLIENT_KEY: Mid-client-xjQUjCcbhOHl68O3
        VITE_MIDTRANS_IS_PRODUCTION: "false"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-reverbkey}
        VITE_APP_TARGET: seller
        VITE_BUYER_APP_URL: ${BUYER_APP_URL:-https://blukios.store}
        VITE_SELLER_APP_URL: ${SELLER_APP_URL:-https://seller.blukios.store}
    container_name: blue-frontend-seller
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - fe_dist_seller:/app/dist

  # ─────────────────────────────────────────
  # AI Service (FastAPI + Ollama)
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: blue-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama

  chat-service:
    build:
      context: ./chat-service
    container_name: blue-ai
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    # Sprint C2.1B: Redis is now shared-infra's instance, outside this
    # compose project -- Compose can't `depends_on` a service it doesn't
    # own (see docs/c2-1b-shared-redis-cutover.md).
    networks:
      - default
      - shared-infra
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001 --reload --reload-delay 1 --proxy-headers --forwarded-allow-ips='*'
    ports:
      - "8001:8001"
    volumes:
      - ./chat-service:/app
      - chroma_data:/app/chroma_db        # RAG vector index
      - chroma_cache:/root/.cache/chroma  # ONNX model cache — hindari re-download 79MB
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:1.7b
      OLLAMA_TIMEOUT_S: 180
      OLLAMA_MAX_RETRIES: 1
      LARAVEL_API_URL: http://nginx:80
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://lab-hajel.tail03faae.ts.net,http://192.168.1.29,http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: 20
      SESSION_TTL_MINUTES: 60
      # Shared Redis (Sprint C2.1B) -- built from components, not a
      # credential-bearing URL (see chat-service/config.py).
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env -- shared Redis tidak lagi unauthenticated}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_PREFIX:-blukios:}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY wajib diisi di .env}

  # ─────────────────────────────────────────
  # Recommendation Service (content-based + collaborative filtering)
  # ─────────────────────────────────────────
  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: blue-recommendation
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "8002:8002"
    volumes:
      - ./recommendation-service:/app
      - reco_models:/app/models   # model SVD terlatih -- persist antar restart, gak perlu retrain dari nol
    environment:
      # entrypoint chown /app ke UID/GID ini sebelum start -- cegah bind-mount
      # ./recommendation-service balik jadi owned root (container jalan sebagai
      # root, gak ada USER directive) yang bikin host user gak bisa git pull lagi
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      LARAVEL_API_URL: http://nginx:80
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY wajib diisi di .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://lab-hajel.tail03faae.ts.net,http://192.168.1.29,http://localhost:5173,http://localhost:3000}
      CBF_TOP_K: 8
      PRODUCT_CACHE_REFRESH_MINUTES: 30
      CF_TOP_K: 8
      CF_MIN_INTERACTIONS: 50
      CF_MIN_ACTIVE_USERS: 5
      CF_RETRAIN_INTERVAL_HOURS: 24
      CF_MODEL_PATH: /app/models/svd_model.pkl

  # ─────────────────────────────────────────
  # Monitoring (optional profile)
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: blue-prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"   # simpan 15 hari histori
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus               # persist data antar restart
    depends_on:
      - chat-service
      - nginx

  grafana:
    image: grafana/grafana:latest
    container_name: blue-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${MAIL_USERNAME:-}
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@blukios.com}
      GF_SMTP_FROM_NAME: "Blukios Alerting"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    container_name: blue-k6
    profiles: ["loadtest"]
    volumes:
      - ./monitoring/k6:/scripts:ro
    entrypoint: ["k6", "run", "/scripts/loadtest.js"]
    depends_on:
      - chat-service

  # ─────────────────────────────────────────
  # CD — Jenkins (opsional, profile "cd")
  # ─────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: blue-jenkins
    profiles: ["cd"]
    restart: unless-stopped
    user: root  # perlu akses /var/run/docker.sock milik root di host
    ports:
      - "8082:8080"   # web UI — beda dari mongo-express (8081)
      - "50000:50000" # agent port (tidak dipakai untuk built-in node, aman dibiarkan)
    environment:
      JAVA_OPTS: "-Xmx512m -Duser.timezone=Asia/Jakarta"
      TZ: "Asia/Jakarta"
      # dipakai Jenkinsfile buat cd — HARUS sama persis dgn source volume di bawah,
      # soalnya docker compose yg dijalankan di dalam container ini ngomong ke docker
      # daemon HOST (lewat docker.sock), bukan daemon di dalam container. Kalau target
      # mount beda dari path host asli (misal /host-project), relative path (./docker/nginx/...)
      # di-resolve jadi absolute path yg cuma valid di namespace container Jenkins, lalu
      # dikirim ke daemon host yang gak punya path itu -> "bind source path does not exist"
      HOST_PROJECT_DIR: ${PWD}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
      # mount direktori project host PERSIS di path yang sama (bukan /host-project) —
      # biar relative path di docker-compose.yml (./docker/nginx/default.conf dkk) di-resolve
      # jadi absolute path yang juga valid di docker daemon host. Efek sampingnya: nama folder
      # otomatis "marketplace" jadi -p marketplace di Jenkinsfile tetap dipertahankan untuk jaga-jaga.
      - ${PWD}:${PWD}

volumes:
  ollama:
  grafana:
  prometheus_data:   # Prometheus histori metrics
  chroma_data:       # ChromaDB RAG vector index
  jenkins_home:      # Jenkins config, job history, plugin
  chroma_cache:      # ONNX model all-MiniLM-L6-v2 cache (79MB)
  api_vendor:
  fe_node_modules:
  fe_dist:
  fe_dist_seller:    # Build seller app (seller.blukios.store)
  reco_models:       # Model SVD terlatih (recommendation-service)

networks:
  # Sprint C2.1B: shared Redis lives outside this compose project, in
  # /opt/shared-infra's own stack -- see docs/c2-1b-shared-redis-cutover.md.
  # This network must already exist on the host (created by shared-infra);
  # Compose only attaches to it here, never creates or manages it.
  shared-infra:
    external: true
    name: shared-infra-net
